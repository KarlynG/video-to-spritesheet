[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-spritesheet"
version = "0.2.0"
description = "Local video-to-sprite-sheet conversion for humans and AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KarlynG"}]
keywords = ["spritesheet", "sprite-sheet", "video", "ffmpeg", "mcp", "animation", "agents", "gamedev", "unity", "phaser", "unreal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.urls]
Homepage = "https://github.com/KarlynG/video-to-spritesheet"
Documentation = "https://github.com/KarlynG/video-to-spritesheet/blob/main/docs/USAGE.md"
Issues = "https://github.com/KarlynG/video-to-spritesheet/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
video-to-spritesheet = "video_to_spritesheet.cli:main"
video-to-spritesheet-mcp = "video_to_spritesheet.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_to_spritesheet = ["templates/*.cs"]
